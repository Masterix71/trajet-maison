<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trajet Domicile-Travail - CNPE Cruas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF6B00">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary: #FF6B00;
            --primary-dark: #e65c00;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .trip-toggle {
            display: flex;
            background-color: #f0f0f0;
            border-radius: 30px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .trip-toggle button {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            transition: 0.3s;
        }
        .trip-toggle button.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 { text-align: center; font-size: 18px; margin-bottom: 15px; color: #444; }

        .time-display { font-size: 38px; font-weight: bold; color: var(--primary); text-align: center; line-height: 1; margin-bottom: 5px; }
        .distance-display { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }

        .timeline {
            margin-top: 10px;
            padding-left: 20px;
            border-left: 3px solid #e0e0e0;
            position: relative;
        }
        .step {
            position: relative;
            margin-bottom: 25px;
        }
        .step:last-child { margin-bottom: 0; border-left: none; }
        .step::before {
            content: ''; position: absolute;
            left: -27px; top: 2px;
            width: 12px; height: 12px;
            border-radius: 50%;
            background-color: white;
            border: 3px solid var(--primary);
        }
        
        .step-time { font-weight: bold; font-size: 15px; color: var(--text-main); }
        .step-info { font-size: 13px; color: #555; margin-top: 4px; }
        
        .step.arrival-step::before {
            width: 16px; height: 16px; left: -29px; top: 4px;
            background-color: var(--primary);
        }
        .highlight-time {
            font-size: 24px;
            color: var(--primary);
            background-color: #fff3e6;
            padding: 2px 8px;
            border-radius: 6px;
            display: inline-block;
        }
        .highlight-text { font-size: 15px; color: #000; font-weight: bold; }
        
        .badge {
            display: inline-block; padding: 4px 10px; border-radius: 12px;
            font-size: 12px; font-weight: bold; margin-top: 6px;
        }
        .badge-neutral { background: #f1f3f4; color: #5f6368; }

        .btn-refresh {
            background-color: var(--primary); color: white; border: none;
            padding: 15px 30px; font-size: 16px; border-radius: 30px;
            cursor: pointer; font-weight: bold; width: 100%; max-width: 400px;
            box-shadow: 0 4px 10px rgba(255, 107, 0, 0.3);
        }
        .btn-refresh:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="card">
        
        <div class="trip-toggle">
            <button id="btn-aller" class="active" onclick="setTripDirection(false)">🏠 ➡️ 🏭 Aller</button>
            <button id="btn-retour" onclick="setTripDirection(true)">🏭 ➡️ 🏠 Retour</button>
        </div>

        <h1 id="trip-title">Trajet vers le CNPE de Cruas</h1>
        
        <div id="loading" style="text-align: center; color: #666; padding: 20px 0;">Calcul de l'itinéraire...</div>
        
        <div id="result" style="display: none;">
            <div class="time-display" id="time">-- min</div>
            <div class="distance-display" id="distance">-- km</div>
            
            <div class="timeline" id="timeline-container">
                <!-- Les étapes s'afficheront ici -->
            </div>
        </div>
    </div>

    <button class="btn-refresh" onclick="fetchRoute()">🔄 Actualiser l'heure</button>

    <script>
        // Coordonnées GPS exactes (Longitude, Latitude pour OSRM)
        const homeLat = 44.566, homeLon = 4.755; // Avenue Saint-Lazare
        const workLat = 44.633, workLon = 4.756; // CNPE Cruas
        
        let isReturnTrip = false;

        function setTripDirection(isReturn) {
            isReturnTrip = isReturn;
            document.getElementById('btn-aller').classList.toggle('active', !isReturn);
            document.getElementById('btn-retour').classList.toggle('active', isReturn);
            document.getElementById('trip-title').innerText = isReturn ? "Trajet vers l'Avenue Saint-Lazare" : "Trajet vers le CNPE de Cruas";
            fetchRoute();
        }

        function formatTime(date) {
            const h = date.getHours().toString().padStart(2, '0');
            const m = date.getMinutes().toString().padStart(2, '0');
            return `${h}h${m}`;
        }

        async function fetchRoute() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            // OSRM attend l'ordre : longitude,latitude
            const startLon = isReturnTrip ? workLon : homeLon;
            const startLat = isReturnTrip ? workLat : homeLat;
            const endLon = isReturnTrip ? homeLon : workLon;
            const endLat = isReturnTrip ? homeLat : workLat;

            const url = `https://router.project-osrm.org/route/v1/driving/${startLon},${startLat};${endLon},${endLat}?overview=false`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.code === 'Ok') {
                    const route = data.routes[0];
                    const totalMin = Math.ceil(route.duration / 60);
                    const distanceKm = (route.distance / 1000).toFixed(1);

                    document.getElementById('time').innerText = totalMin + " min";
                    document.getElementById('distance').innerText = distanceKm + " km";

                    generateSteps(totalMin);

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('result').style.display = 'block';
                } else {
                    document.getElementById('loading').innerText = "Erreur de calcul d'itinéraire.";
                }
            } catch (error) {
                document.getElementById('loading').innerText = "Erreur de réseau ❌";
            }
        }

        function generateSteps(totalMin) {
            const container = document.getElementById('timeline-container');
            const now = new Date();
            
            const startLabel = isReturnTrip ? "🏭 Départ : CNPE de Cruas" : "🏠 Départ : Avenue Saint-Lazare";
            const endLabel = isReturnTrip ? "🏠 Arrivée : Avenue Saint-Lazare" : "🏭 Arrivée : CNPE de Cruas";

            let html = `
                <div class="step">
                    <div class="step-time">${formatTime(now)}</div>
                    <div class="step-info">${startLabel}</div>
                </div>`;

            const nbEtapes = Math.floor(totalMin / 5);

            for (let i = 1; i <= nbEtapes; i++) {
                const elapsed = i * 5;
                if (totalMin - elapsed < 2) continue; 
                
                const stepTime = new Date(now.getTime() + elapsed * 60000);

                html += `
                <div class="step">
                    <div class="step-time">${formatTime(stepTime)}</div>
                    <div class="step-info">Point de passage <br> <span class="badge badge-neutral">⚪ Route fluide</span></div>
                </div>`;
            }

            const arrivalTime = new Date(now.getTime() + totalMin * 60000);
            html += `
                <div class="step arrival-step">
                    <div class="step-time highlight-time">${formatTime(arrivalTime)}</div>
                    <div class="step-info highlight-text">${endLabel}</div>
                </div>`;

            container.innerHTML = html;
        }

        fetchRoute();
        
        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js'); 
            }); 
        }
    </script>
</body>
</html>
