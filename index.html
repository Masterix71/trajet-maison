<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trajet Domicile-Travail - CNPE Cruas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF6B00">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary: #FF6B00;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .trip-toggle {
            display: flex;
            background-color: #f0f0f0;
            border-radius: 30px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .trip-toggle button {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            transition: 0.3s;
        }
        .trip-toggle button.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 { text-align: center; font-size: 18px; margin-bottom: 15px; color: #444; }

        .time-display { font-size: 38px; font-weight: bold; color: var(--primary); text-align: center; line-height: 1; margin-bottom: 5px; }
        .distance-display { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }

        .timeline {
            margin-top: 10px;
            padding-left: 20px;
            border-left: 3px solid #e0e0e0;
            position: relative;
        }
        .step {
            position: relative;
            margin-bottom: 25px;
        }
        .step:last-child { margin-bottom: 0; border-left: none; }
        .step::before {
            content: ''; position: absolute;
            left: -27px; top: 2px;
            width: 12px; height: 12px;
            border-radius: 50%;
            background-color: white;
            border: 3px solid var(--primary);
        }
        
        .step-time { font-weight: bold; font-size: 15px; color: var(--text-main); }
        .step-info { margin-top: 4px; }
        
        .step-name { font-weight: bold; display: block; color: #222; font-size: 14px; }
        .step-road { display: block; font-size: 12px; color: #777; margin-bottom: 4px; }
        
        .step.arrival-step::before {
            width: 16px; height: 16px; left: -29px; top: 4px;
            background-color: var(--primary);
        }
        .highlight-time {
            font-size: 24px;
            color: var(--primary);
            background-color: #fff3e6;
            padding: 2px 8px;
            border-radius: 6px;
            display: inline-block;
        }
        .highlight-text { font-size: 15px; color: #000; font-weight: bold; }
        
        .badge {
            display: inline-block; padding: 4px 10px; border-radius: 12px;
            font-size: 12px; font-weight: bold; margin-top: 2px;
        }
        .badge-fluid { background: #e6f4ea; color: #137333; }
        .badge-slow { background: #fef7e0; color: #b06000; }
        .badge-jam { background: #fce8e6; color: #c5221f; }
        .badge-neutral { background: #f1f3f4; color: #5f6368; }

        .btn-refresh {
            background-color: var(--primary); color: white; border: none;
            padding: 15px 30px; font-size: 16px; border-radius: 30px;
            cursor: pointer; font-weight: bold; width: 100%; max-width: 400px;
            box-shadow: 0 4px 10px rgba(255, 107, 0, 0.3);
        }
        .btn-refresh:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="card">
        <div class="trip-toggle">
            <button id="btn-aller" class="active" onclick="setTripDirection(false)">🏠 ➡️ 🏭 Aller</button>
            <button id="btn-retour" onclick="setTripDirection(true)">🏭 ➡️ 🏠 Retour</button>
        </div>

        <h1 id="trip-title">Trajet vers le CNPE de Cruas</h1>
        
        <div id="loading" style="text-align: center; color: #666; padding: 20px 0;">Calcul de l'itinéraire...</div>
        
        <div id="result" style="display: none;">
            <div class="time-display" id="time">-- min</div>
            <div class="distance-display" id="distance">-- km</div>
            
            <div class="timeline" id="timeline-container">
                <!-- Les étapes s'afficheront ici -->
            </div>
        </div>
    </div>

    <button class="btn-refresh" onclick="fetchRoute()">🔄 Actualiser l'heure</button>

    <script>
        const tomtomApiKey = "cYzZ5Fc2BuFbsd3rwx9UB5Gmhrgpbl2G"; 

        const homeLat = 44.566, homeLon = 4.755; 
        const workLat = 44.633, workLon = 4.756; 
        
        let isReturnTrip = false;

        function setTripDirection(isReturn) {
            isReturnTrip = isReturn;
            document.getElementById('btn-aller').classList.toggle('active', !isReturn);
            document.getElementById('btn-retour').classList.toggle('active', isReturn);
            document.getElementById('trip-title').innerText = isReturn ? "Trajet vers l'Avenue Saint-Lazare" : "Trajet vers le CNPE de Cruas";
            fetchRoute();
        }

        function formatTime(date) {
            const h = date.getHours().toString().padStart(2, '0');
            const m = date.getMinutes().toString().padStart(2, '0');
            return `${h}h${m}`;
        }

        // Renvoie le secteur géographique en fonction de l'avancement (%)
        function getZoneName(elapsed, totalMin, isReturn) {
            const ratio = elapsed / totalMin;
            if (isReturn) {
                if (ratio < 0.25) return "📍 Secteur Cruas";
                if (ratio < 0.55) return "📍 Secteur Meysse";
                if (ratio < 0.85) return "📍 Secteur Rochemaure / Ancône";
                return "📍 Entrée Montélimar";
            } else {
                if (ratio < 0.25) return "📍 Sortie Montélimar / Ancône";
                if (ratio < 0.55) return "📍 Secteur Rochemaure";
                if (ratio < 0.85) return "📍 Secteur Meysse";
                return "📍 Approche CNPE Cruas";
            }
        }

        // Trouve le nom de la route depuis le GPS
        function getRoadNameAt(targetMinutes, apiSteps) {
            if (!apiSteps || apiSteps.length === 0) return "Route principale";
            const targetSeconds = targetMinutes * 60;
            let accumulated = 0;
            
            for (let step of apiSteps) {
                accumulated += step.duration;
                if (accumulated >= targetSeconds) {
                    return step.name && step.name.trim() !== "" ? step.name : "Route principale";
                }
            }
            return apiSteps[apiSteps.length - 1].name || "Route principale";
        }

        async function fetchRoute() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            const startLat = isReturnTrip ? workLat : homeLat;
            const startLon = isReturnTrip ? workLon : homeLon;
            const endLat = isReturnTrip ? homeLat : workLat;
            const endLon = isReturnTrip ? homeLon : workLon;

            try {
                let totalMin = 0;
                let distanceKm = 0;
                let delayMin = 0;
                let apiSteps = []; 

                if (tomtomApiKey !== "") {
                    const url = `https://api.tomtom.com/routing/1/calculateRoute/${startLat},${startLon}:${endLat},${endLon}/json?key=${tomtomApiKey}&traffic=true&computeTravelTimeFor=all&instructionsType=text&language=fr-FR`;
                    const res = await fetch(url);
                    const data = await res.json();
                    const summary = data.routes[0].summary;
                    
                    totalMin = Math.ceil(summary.travelTimeInSeconds / 60);
                    distanceKm = (summary.lengthInMeters / 1000).toFixed(1);
                    const noTrafficMin = Math.ceil(summary.noTrafficTravelTimeInSeconds / 60);
                    delayMin = totalMin - noTrafficMin;

                    // Parse TomTom
                    if (data.routes[0].guidance && data.routes[0].guidance.instructions) {
                        apiSteps = data.routes[0].guidance.instructions.map(inst => {
                            let rName = inst.street || "";
                            if (inst.roadNumbers && inst.roadNumbers.length > 0) {
                                let ref = inst.roadNumbers[0];
                                rName = rName ? `${ref} (${rName})` : ref;
                            }
                            return { name: rName, duration: inst.travelTimeInSeconds || 0 };
                        });
                    }
                } else {
                    const url = `https://router.project-osrm.org/route/v1/driving/${startLon},${startLat};${endLon},${endLat}?overview=false&steps=true`;
                    const res = await fetch(url);
                    const data = await res.json();
                    
                    totalMin = Math.ceil(data.routes[0].duration / 60);
                    distanceKm = (data.routes[0].distance / 1000).toFixed(1);
                    delayMin = 0; 

                    // Parse OSRM avec récupération du numéro de route (ex: D86)
                    if (data.routes[0].legs && data.routes[0].legs[0].steps) {
                        apiSteps = data.routes[0].legs[0].steps.map(step => {
                            let rName = step.name || "";
                            if (step.ref) { // On récupère le "D 86"
                                rName = rName ? `${step.ref} (${rName})` : step.ref;
                            }
                            return { name: rName, duration: step.duration || 0 };
                        });
                    }
                }

                document.getElementById('time').innerText = totalMin + " min";
                document.getElementById('distance').innerText = distanceKm + " km" + (tomtomApiKey ? " (Trafic Live)" : "");

                generateSteps(totalMin, delayMin, apiSteps);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('result').style.display = 'block';

            } catch (error) {
                document.getElementById('loading').innerText = "Erreur de connexion réseau ❌";
            }
        }

        function generateSteps(totalMin, delayMin, apiSteps) {
            const container = document.getElementById('timeline-container');
            const now = new Date();
            
            const startLabel = isReturnTrip ? "🏭 Départ : CNPE de Cruas" : "🏠 Départ : Avenue Saint-Lazare";
            const endLabel = isReturnTrip ? "🏠 Arrivée : Avenue Saint-Lazare" : "🏭 Arrivée : CNPE de Cruas";

            let html = `
                <div class="step">
                    <div class="step-time">${formatTime(now)}</div>
                    <div class="step-info"><span class="step-name">${startLabel}</span></div>
                </div>`;

            const nbEtapes = Math.floor(totalMin / 5);
            let lastRoadName = "";

            for (let i = 1; i <= nbEtapes; i++) {
                const elapsed = i * 5;
                if (totalMin - elapsed < 2) continue; 
                
                const stepTime = new Date(now.getTime() + elapsed * 60000);
                
                // 1. On récupère le nom du secteur
                const zone = getZoneName(elapsed, totalMin, isReturnTrip);

                // 2. On récupère le vrai nom technique du GPS (ex: D86)
                let currentRoadName = getRoadNameAt(elapsed, apiSteps);
                let displayRoad = `🛣️ ${currentRoadName}`;
                
                // Si on est sur la même route qu'il y a 5 min
                if (currentRoadName === lastRoadName) {
                    displayRoad = `↪️ Toujours sur : ${currentRoadName}`;
                }
                lastRoadName = currentRoadName;
                
                let badge = "";

                if (tomtomApiKey !== "") {
                    if (delayMin >= 3 && i === Math.ceil(nbEtapes / 2)) {
                        badge = `<span class="badge badge-jam">🔴 Bouchon (+${delayMin}min)</span>`;
                    } else if (delayMin > 0) {
                        badge = `<span class="badge badge-slow">🟠 Trafic Ralenti</span>`;
                    } else {
                        badge = `<span class="badge badge-fluid">🟢 Fluide</span>`;
                    }
                } else {
                    badge = `<span class="badge badge-neutral">⚪ Route fluide</span>`;
                }

                html += `
                <div class="step">
                    <div class="step-time">${formatTime(stepTime)}</div>
                    <div class="step-info">
                        <span class="step-name">${zone}</span>
                        <span class="step-road">${displayRoad}</span>
                        ${badge}
                    </div>
                </div>`;
            }

            const arrivalTime = new Date(now.getTime() + totalMin * 60000);
            html += `
                <div class="step arrival-step">
                    <div class="step-time highlight-time">${formatTime(arrivalTime)}</div>
                    <div class="step-info highlight-text">${endLabel}</div>
                </div>`;

            container.innerHTML = html;
        }

        fetchRoute();
        
        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js'); 
            }); 
        }
    </script>
</body>
</html>
